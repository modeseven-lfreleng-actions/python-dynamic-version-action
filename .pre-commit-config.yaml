# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

ci:
  # basedpyright's hook environment measures 284 MiB (bundled Node.js
  # 200 MiB, basedpyright 73 MiB, plus pytest and tomli), over
  # pre-commit.ci's 250 MiB per-hook limit, so it cannot run there.
  # No workflow in this repository runs it either: it is enforced
  # developer-side only, by the local hook and the editor.
  skip: [basedpyright]
  autofix_prs: false
  autofix_commit_msg: |
    Chore: pre-commit autofixes

    Signed-off-by: pre-commit-ci[bot] <pre-commit-ci@users.noreply.github.com>
  autoupdate_commit_msg: |
    Chore: pre-commit autoupdate

    Signed-off-by: pre-commit-ci[bot] <pre-commit-ci@users.noreply.github.com>

exclude: "^docs/conf.py"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args:
          - --branch=dev
          - --branch=master
          - --branch=main
          - --branch=rc
          - --branch=production

  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98 # frozen: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        types: [yaml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee  # frozen: v2.3.1
    hooks:
      - id: mypy

  - repo: https://github.com/btford/write-good
    rev: ab66ce10136dfad5146e69e70f82a3efac8842c1 # frozen: v1.0.8
    hooks:
      - id: write-good
        files: "\\.(rst|md|markdown|mdown|mkdn)$"

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # frozen: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--fix"]

  - repo: https://github.com/fsfe/reuse-tool
    rev: 9fabf9eb815a57aac116b435e8346c200cdb8604  # frozen: v6.2.0
    hooks:
      - id: reuse

  # Actively maintained fork of https://github.com/rhysd/actionlint
  # Upstream v1.7.12 predates GitHub's self-repository 'uses: $/{path}'
  # syntax and rejects it, which conflicts with zizmor's
  # self-repository audit. This fork understands it. A bare '$/' (an
  # action at the repository root) is still rejected;
  # .github/actionlint.yaml carries a path-scoped ignore for that case.
  - repo: https://github.com/kjanat/actionlint
    rev: 2da2ceb4af2c7ecc48f5b9311d85080c3971b5f0  # frozen: v1.17.0
    hooks:
      - id: actionlint

  # Check for misspellings in documentation files
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell

  # Requires a mirror, primary repo lacks .pre-commit-hooks.yaml
  #
  # Configured in pyrightconfig.json rather than [tool.basedpyright],
  # deliberately. A root pyproject.toml, even a tool-only one, makes
  # this repository look like an installable Python project: tox.ini
  # (isolated_build) switches from skipping packaging to building an
  # sdist of the repository, and 'pip install .' (used by
  # .readthedocs.yml) stops rejecting the directory as not installable
  # and builds a package instead. The action itself only reads
  # <path_prefix>/pyproject.toml in the caller's project, so it is
  # unaffected either way. pyrightconfig.json is read by (based)pyright
  # alone; it takes no comments, hence this note lives here.
  - repo: https://github.com/DetachHead/basedpyright-prek-mirror
    rev: 706e6acebe9e88c2c28d1527d3085a14b11794c4  # frozen: 1.40.1
    hooks:
      - id: basedpyright
        # Fail on warnings as well as errors, so anything an editor's
        # language server shows also blocks the commit.
        #
        # Explicit directories with filename passing disabled: with file
        # arguments present, 'include' is not the analysis scope, so a
        # change to the script could break an unstaged test unnoticed.
        # Keep this list identical to 'include' in pyrightconfig.json.
        pass_filenames: false
        # Run even when no Python file is staged (deletions, config-only).
        always_run: true
        args: [--warnings, scripts, tests]
        # Third-party imports in the scanned code, installed so they
        # resolve genuinely: pytest (tests) and tomli (the script's
        # Python 3.10 fallback for tomllib). Both ship inline types.
        additional_dependencies: ["pytest", "tomli"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
    hooks:
      - id: check-github-actions
      - id: check-github-workflows
      - id: check-jsonschema
        name: Check GitHub Workflows set timeout-minutes
        args:
          - --builtin-schema
          - github-workflows-require-timeout
        files: ^\.github/workflows/[^/]+$
        types:
          - yaml
      - id: check-readthedocs
